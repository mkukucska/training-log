<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Training log</title>
<meta name="theme-color" content="#F5F1E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Training%20Log%22%2C%22short_name%22%3A%22Training%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F5F1E8%22%2C%22theme_color%22%3A%22%23F5F1E8%22%7D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23384A3A'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23F5F1E8' font-family='Georgia,serif'%3E5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8;
    --card: #FDFCF8;
    --card-sunken: #ECE7DA;
    --border: #DFD8C5;
    --border-strong: #C7BEA5;
    --text-primary: #2A281F;
    --text-secondary: #6E6852;
    --text-muted: #A39C82;
    --accent: #384A3A;
    --accent-light: #E1E6DD;
    --accent-text: #26331F;
    --secondary: #6B5A94;
    --secondary-light: #EAE4F2;
    --secondary-text: #4A3D6B;
    --warn: #8A5A2E;
    --warn-light: #F3E8D8;
    --danger: #96382E;
    --danger-light: #F5E4E0;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display: 'Fraunces', Georgia, serif;
    --shadow-card: 0 1px 2px rgba(42,40,31,0.04), 0 1px 8px rgba(42,40,31,0.03);
  }
  [data-mode="dark"] {
    --bg: #14121B;
    --card: #1D1A28;
    --card-sunken: #262233;
    --border: #34304A;
    --border-strong: #453F63;
    --text-primary: #EAE6F5;
    --text-secondary: #A79FC4;
    --text-muted: #6E6690;
    --accent: #8FD9A8;
    --accent-light: #223A2C;
    --accent-text: #A9E8BE;
    --secondary: #B79CF0;
    --secondary-light: #2E2647;
    --secondary-text: #CDB8FA;
    --warn: #D9A46B;
    --warn-light: #332619;
    --danger: #E28A9A;
    --danger-light: #372230;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 1px 10px rgba(94,60,200,0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    padding: 0 0 3rem;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 1.1rem 1.1rem 0; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 25px;
    margin: 0.2rem 0 0.15rem; letter-spacing: -0.01em;
  }
  .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 0.9rem; }
  .mode-toggle {
    width: 36px; height: 36px; border-radius: 10px; border: 0.5px solid var(--border-strong);
    background: var(--card); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto; margin-top: 0.2rem; color: var(--text-secondary); font-size: 16px;
  }
  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 6px; background: var(--bg);
    padding: 0.6rem 0; margin: 0 0 1rem;
    border-bottom: 0.5px solid var(--border);
    overflow-x: auto;
    max-width: 480px; margin-left: auto; margin-right: auto;
    padding-left: 1.1rem; padding-right: 1.1rem;
    box-sizing: border-box; width: 100%;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-strong);
    background: var(--card); color: var(--text-secondary); cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .card {
    background: var(--card); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 1.1rem; margin-bottom: 0.75rem;
    box-shadow: var(--shadow-card);
  }
  .card h2 {
    font-family: var(--font-display); font-size: 17px; font-weight: 600;
    margin: 0 0 0.7rem; display: flex; align-items: center; justify-content: space-between;
    letter-spacing: -0.005em;
  }
  .row { padding: 12px 0; border-top: 0.5px solid var(--border); }
  .row:first-of-type { border-top: none; padding-top: 2px; }
  .ex-top { display: flex; align-items: center; justify-content: space-between; }
  .ex-name { font-size: 14.5px; font-weight: 500; }
  .ex-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .weight-badge {
    font-family: var(--font-display); font-size: 15px; font-weight: 600;
    background: var(--accent-light); color: var(--accent-text);
    padding: 4px 11px; border-radius: 9px; min-width: 50px; text-align: center;
  }
  .btn {
    border: 0.5px solid var(--border-strong); background: var(--card);
    border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 500;
    color: var(--text-primary); cursor: pointer; font-family: var(--font-sans);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 0.6rem; flex-wrap: wrap; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .pill-group { display: flex; gap: 6px; margin-top: 8px; }
  .pill {
    flex: 1; text-align: center; padding: 7px 4px; border-radius: 9px;
    font-size: 12px; font-weight: 500; border: 0.5px solid var(--border-strong);
    background: var(--card); cursor: pointer; color: var(--text-secondary);
  }
  .pill.clean { border-color: var(--accent); }
  .pill.tough { border-color: var(--warn); }
  .pill.shaky { border-color: var(--danger); }
  .pill.selected.clean { background: var(--accent); color: var(--bg); }
  .pill.selected.tough { background: var(--warn); color: var(--bg); }
  .pill.selected.shaky { background: var(--danger); color: var(--bg); }
  .bottle-row { display: flex; gap: 8px; margin: 0.6rem 0; }
  .bottle {
    flex: 1; aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
    background: var(--card-sunken); cursor: pointer; color: var(--text-muted); font-family: var(--font-display);
  }
  .bottle.filled { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 0.5rem; }
  .stat { background: var(--card-sunken); border-radius: 11px; padding: 11px; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .stat-val { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .empty { font-size: 13px; color: var(--text-muted); text-align: center; padding: 1.6rem 0; }
  .banner {
    background: var(--warn-light); border-radius: 11px; padding: 10px 12px;
    font-size: 12.5px; color: var(--warn); margin-bottom: 0.75rem; display: flex; gap: 8px; align-items: flex-start;
  }
  .banner.cap { background: var(--accent-light); color: var(--accent-text); }
  select, input[type=number] {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 0.5px solid var(--border-strong);
    background: var(--card-sunken); font-size: 14px; color: var(--text-primary); font-family: var(--font-sans);
  }
  .day-toggle { display: flex; gap: 6px; margin-bottom: 0.75rem; }
  .day-btn {
    flex: 1; padding: 11px; border-radius: 11px; border: 0.5px solid var(--border-strong);
    background: var(--card); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: var(--text-secondary);
  }
  .day-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .checklist-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 0.5px solid var(--border); }
  .checklist-item:first-child { border-top: none; }
  .check {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 13px; flex: 0 0 auto; color: transparent;
    cursor: pointer;
  }
  .check.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .w-label { font-size: 13px; font-weight: 500; }
  .log-entry { font-size: 12.5px; padding: 10px 0; border-top: 0.5px solid var(--border); color: var(--text-secondary); }
  .log-entry:first-child { border-top: none; }
  .log-date { font-family: var(--font-display); font-weight: 600; color: var(--text-primary); font-size: 14px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--bg); font-size: 13px; padding: 10px 16px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    z-index: 50; white-space: nowrap; display: flex; align-items: center; gap: 10px;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button {
    background: none; border: none; color: var(--accent-light); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 0; font-family: var(--font-sans);
  }
  [data-mode="dark"] .toast button { color: #8FB598; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .small-btn-group { display: flex; gap: 4px; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 0.5px solid var(--border-strong);
    background: var(--card); display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; color: var(--text-secondary); flex: 0 0 auto;
  }
  .install-banner {
    display: flex; align-items: flex-start; gap: 8px; background: var(--accent-light);
    color: var(--accent-text); font-size: 12px; line-height: 1.5; padding: 10px 12px;
    border-radius: 11px; margin-bottom: 0.75rem;
  }
  .install-banner .icon-btn { background: transparent; border: none; color: var(--accent-text); }
  .set-chips { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .set-chip {
    width: 40px; height: 40px; border-radius: 10px; border: 1.5px dashed var(--border-strong);
    background: var(--card-sunken); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; flex: 0 0 auto;
    font-family: var(--font-display);
  }
  .set-chip.filled {
    border-style: solid; background: var(--secondary-light); border-color: var(--secondary);
    color: var(--secondary-text);
  }
  .reps-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  section#content { padding-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>Training log</h1>
      <p class="sub" id="dateRange">35-day reset &middot; Aug 27&ndash;Oct 1</p>
    </div>
    <button class="mode-toggle" id="modeToggle" aria-label="Toggle dark mode">&#9789;</button>
  </div>
  <div class="install-banner" id="installBanner" style="display:none;">
    <span>Add this to your home screen: open the browser menu and tap <strong>Add to Home Screen</strong>.</span>
    <button class="icon-btn" id="dismissInstall" aria-label="Dismiss">&times;</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="today">Today</button>
  <button class="tab" data-tab="progress">Progress</button>
  <button class="tab" data-tab="cardio">Running</button>
  <button class="tab" data-tab="hydration">Hydration</button>
  <button class="tab" data-tab="supplements">Supplements</button>
  <button class="tab" data-tab="log">Log</button>
</div>

<div class="wrap" id="content"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- data model ----------
const PROGRAM = {
  A: {
    label: "Day A",
    exercises: [
      { id: "squat_a", name: "Squats", type: "squat", sets: 5, reps: 5, track: "heavy" },
      { id: "pecfly", name: "Pec fly", type: "feel", sets: 3, reps: 10 },
      { id: "hipabd", name: "Hip abduction", type: "feel", sets: 3, reps: 12 },
      { id: "latpull", name: "Lat pulldown", type: "feel", sets: 3, reps: 10 }
    ]
  },
  B: {
    label: "Day B",
    exercises: [
      { id: "squat_b", name: "Squats", type: "squat", sets: 5, reps: 5, track: "light" },
      { id: "chestpress", name: "Chest press", type: "feel", sets: 3, reps: 10 },
      { id: "shoulderpress", name: "Shoulder press", type: "feel", sets: 3, reps: 10 },
      { id: "hamcurl", name: "Hamstring curl", type: "feel", sets: 3, reps: 10 }
    ]
  }
};
const CORE_OPTIONS = [
  { id: "plank", name: "Plank", mode: "time" },
  { id: "hollow", name: "Hollow body hold", mode: "time" },
  { id: "abcrunch", name: "Ab crunch machine", mode: "reps" },
  { id: "abtwist", name: "Ab twist machine", mode: "reps" }
];
const SQUAT_CAP = 205;
const SUPPLEMENTS = [
  { id: "omega3", name: "Omega-3", note: "Well-supported, recovery and inflammation", doses: 1 },
  { id: "multivitamin", name: "Multivitamin", note: "Baseline coverage", doses: 1 },
  { id: "probiotic", name: "Probiotic", note: "Gut health support", doses: 1 },
  { id: "antioxidant", name: "Super antioxidant", note: "Evidence mixed \u2014 may blunt training adaptation at high doses", doses: 2 },
  { id: "glucosaplex", name: "Glucosaplex", note: "Glucosamine, turmeric, ginger, MSM, cat's claw \u2014 joint support, relevant given knee/Achilles history", doses: 3 }
];

const DEFAULT_STATE = {
  mode: "light",
  weights: {
    squat_a: 135, squat_b: 75, pecfly: 115, hipabd: 55, latpull: 110,
    chestpress: 60, shoulderpress: 50, hamcurl: 50,
    abcrunch: 95, abtwist: 65
  },
  squatPhase: "ramp10",
  squatBumpCount: 0,
  hydrationToday: { date: null, bottles: 0 },
  c25k: {},
  sessions: [],
  installDismissed: false,
  supplementsToday: { date: null, taken: {} }
};

let state = null;
let currentTab = "today";
let selectedDay = "A";
let todayDraft = {};   // exId -> { weight, feel, sets: [{weight}|null], weightSet }
let coreDraft = [];
let lastDeletedSession = null;
let undoTimer = null;

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// ---------- storage ----------
const STORAGE_KEY = "training_state";

async function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign({}, DEFAULT_STATE, parsed);
      state.weights = Object.assign({}, DEFAULT_STATE.weights, parsed.weights || {});
      state.hydrationToday = parsed.hydrationToday || { date: null, bottles: 0 };
      state.c25k = parsed.c25k || {};
      state.sessions = parsed.sessions || [];
      state.supplementsToday = parsed.supplementsToday || { date: null, taken: {} };
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  } catch (e) {
    console.error("load failed", e);
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  if (state.hydrationToday.date !== todayStr()) {
    state.hydrationToday = { date: todayStr(), bottles: 0 };
  }
  if (state.supplementsToday.date !== todayStr()) {
    state.supplementsToday = { date: todayStr(), taken: {} };
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("save failed", e);
    showToast("Save failed \u2014 storage may be full or blocked");
  }
}

function showToast(msg, undoFn) {
  const t = document.getElementById("toast");
  t.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = msg;
  t.appendChild(span);
  if (undoFn) {
    const btn = document.createElement("button");
    btn.textContent = "Undo";
    btn.onclick = () => { undoFn(); t.classList.remove("show"); };
    t.appendChild(btn);
  }
  t.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => t.classList.remove("show"), 4500);
}

// ---------- dark mode ----------
function applyMode() {
  document.documentElement.setAttribute("data-mode", state.mode);
  document.getElementById("modeToggle").innerHTML = state.mode === "dark" ? "&#9728;" : "&#9789;";
}

// ---------- squat progression ----------
function nextSquatWeight(track) {
  const key = track === "heavy" ? "squat_a" : "squat_b";
  const current = state.weights[key];
  if (current >= SQUAT_CAP) return current;
  const increment = state.squatPhase === "ramp10" ? 10 : 5;
  let next = current + increment;
  if (track === "heavy" && next >= SQUAT_CAP) next = SQUAT_CAP;
  return next;
}
function applySquatWeight(track, newWeight) {
  const key = track === "heavy" ? "squat_a" : "squat_b";
  state.weights[key] = newWeight;
  if (track === "heavy" && state.squatPhase === "ramp10") {
    state.squatBumpCount += 1;
    if (state.squatBumpCount >= 3) state.squatPhase = "ramp5";
  }
}

// ---------- render root ----------
function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === currentTab));
  const el = document.getElementById("content");
  el.replaceChildren();
  if (currentTab === "today") renderToday(el);
  else if (currentTab === "progress") renderProgress(el);
  else if (currentTab === "cardio") renderCardio(el);
  else if (currentTab === "hydration") renderHydration(el);
  else if (currentTab === "supplements") renderSupplements(el);
  else if (currentTab === "log") renderLog(el);
}

// ---------- Today tab ----------
function renderToday(el) {
  const dayToggle = document.createElement("div");
  dayToggle.className = "day-toggle";
  ["A", "B"].forEach(d => {
    const b = document.createElement("button");
    b.className = "day-btn" + (selectedDay === d ? " active" : "");
    b.textContent = PROGRAM[d].label;
    b.onclick = () => { selectedDay = d; todayDraft = {}; coreDraft = []; render(); };
    dayToggle.appendChild(b);
  });
  el.appendChild(dayToggle);

  const prog = PROGRAM[selectedDay];
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = prog.label + " session";
  card.appendChild(h2);
  prog.exercises.forEach(ex => card.appendChild(renderExerciseRow(ex)));
  el.appendChild(card);

  const coreCard = document.createElement("div");
  coreCard.className = "card";
  const coreH = document.createElement("h2");
  coreH.textContent = "Core";
  coreCard.appendChild(coreH);
  const coreSub = document.createElement("p");
  coreSub.style.cssText = "font-size:12px;color:var(--text-muted);margin:-6px 0 6px;";
  coreSub.textContent = "Add any that apply today";
  coreCard.appendChild(coreSub);
  CORE_OPTIONS.forEach(c => coreCard.appendChild(renderCoreRow(c)));
  el.appendChild(coreCard);

  const saveBtn = document.createElement("button");
  saveBtn.className = "btn btn-primary";
  saveBtn.style.cssText = "width:100%;padding:13px;font-size:14.5px;margin-top:0.25rem;font-weight:600;";
  saveBtn.textContent = "Save today's session";
  saveBtn.onclick = saveTodaySession;
  el.appendChild(saveBtn);
}

function ensureDraft(ex) {
  if (!todayDraft[ex.id]) {
    todayDraft[ex.id] = { weight: state.weights[ex.id], feel: null, sets: new Array(ex.sets).fill(null), weightSet: false };
  }
  return todayDraft[ex.id];
}

function renderExerciseRow(ex) {
  const wrap = document.createElement("div");
  wrap.className = "row";
  const d = ensureDraft(ex);

  const top = document.createElement("div");
  top.className = "ex-top";
  const left = document.createElement("div");
  const nameEl = document.createElement("div");
  nameEl.className = "ex-name";
  nameEl.textContent = ex.name;
  const metaEl = document.createElement("div");
  metaEl.className = "ex-meta";
  metaEl.textContent = ex.sets + " sets \u00d7 " + ex.reps + " reps";
  left.appendChild(nameEl);
  left.appendChild(metaEl);
  top.appendChild(left);

  const badge = document.createElement("div");
  badge.className = "weight-badge";
  badge.textContent = state.weights[ex.id] + " lb";
  top.appendChild(badge);
  wrap.appendChild(top);

  if (ex.type === "squat") {
    const track = ex.track;
    const key = track === "heavy" ? "squat_a" : "squat_b";
    const atCap = state.weights[key] >= SQUAT_CAP;

    if (atCap) {
      const banner = document.createElement("div");
      banner.className = "banner cap";
      banner.style.marginTop = "9px";
      banner.innerHTML = "<span>&#10003;</span><span>205 lb ceiling reached &mdash; maintenance weight now.</span>";
      wrap.appendChild(banner);
    } else if (!d.weightSet) {
      const suggestion = nextSquatWeight(track);
      const suggBox = document.createElement("div");
      suggBox.style.cssText = "margin-top:9px;padding:9px 11px;background:var(--card-sunken);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;";
      const suggText = document.createElement("span");
      suggText.style.cssText = "font-size:12.5px;color:var(--text-secondary);";
      suggText.textContent = "Suggested " + suggestion + " lb (+" + (state.squatPhase === "ramp10" ? 10 : 5) + ")";
      suggBox.appendChild(suggText);
      const btnGroup = document.createElement("div");
      btnGroup.className = "small-btn-group";
      const acceptBtn = document.createElement("button");
      acceptBtn.className = "btn btn-sm btn-primary";
      acceptBtn.textContent = "Use " + suggestion;
      acceptBtn.onclick = () => { d.weight = suggestion; d.weightSet = true; render(); };
      const editBtn = document.createElement("button");
      editBtn.className = "btn btn-sm";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => { d.weight = state.weights[key]; d.weightSet = true; render(); };
      btnGroup.appendChild(acceptBtn);
      btnGroup.appendChild(editBtn);
      suggBox.appendChild(btnGroup);
      wrap.appendChild(suggBox);
    } else {
      wrap.appendChild(renderSetLogger(ex, d));
    }
  } else {
    wrap.appendChild(renderSetLogger(ex, d));
  }

  return wrap;
}

function renderSetLogger(ex, d) {
  const box = document.createElement("div");
  box.style.marginTop = "9px";

  const weightRow = document.createElement("div");
  weightRow.style.cssText = "display:flex;gap:8px;align-items:center;";
  const input = document.createElement("input");
  input.type = "number";
  input.value = d.weight;
  input.style.flex = "1";
  input.oninput = (e) => { d.weight = Number(e.target.value) || 0; };
  weightRow.appendChild(input);
  const lbl = document.createElement("span");
  lbl.style.cssText = "font-size:12px;color:var(--text-muted);flex:0 0 auto;";
  lbl.textContent = "lb this set";
  weightRow.appendChild(lbl);
  box.appendChild(weightRow);

  const chips = document.createElement("div");
  chips.className = "set-chips";
  for (let i = 0; i < ex.sets; i++) {
    const chip = document.createElement("div");
    const done = d.sets[i];
    chip.className = "set-chip" + (done ? " filled" : "");
    chip.textContent = done ? done.weight : String(i + 1);
    chip.onclick = () => {
      d.sets[i] = done ? null : { weight: d.weight };
      render();
    };
    chips.appendChild(chip);
  }
  box.appendChild(chips);

  const filledCount = d.sets.filter(Boolean).length;
  const note = document.createElement("div");
  note.className = "reps-note";
  note.textContent = filledCount + " of " + ex.sets + " sets logged \u00b7 tap a number to mark it done at the weight above";
  box.appendChild(note);

  if (filledCount > 0 && ex.type !== "squat") {
    const feelRow = document.createElement("div");
    feelRow.style.marginTop = "10px";
    const feelLabel = document.createElement("div");
    feelLabel.style.cssText = "font-size:12px;color:var(--text-secondary);margin-bottom:5px;";
    feelLabel.textContent = "How did it feel?";
    feelRow.appendChild(feelLabel);
    const pillGroup = document.createElement("div");
    pillGroup.className = "pill-group";
    ["clean", "tough", "shaky"].forEach(f => {
      const p = document.createElement("div");
      p.className = "pill " + f + (d.feel === f ? " selected" : "");
      p.textContent = f === "clean" ? "Clean" : f === "tough" ? "Tough" : "Shaky";
      p.onclick = () => { d.feel = f; render(); };
      pillGroup.appendChild(p);
    });
    feelRow.appendChild(pillGroup);
    box.appendChild(feelRow);

    if (d.feel) {
      const hint = document.createElement("div");
      hint.style.cssText = "font-size:11.5px;color:var(--text-muted);margin-top:7px;";
      if (d.feel === "clean") hint.textContent = "Felt clean \u2014 try a bit heavier next session.";
      else if (d.feel === "shaky") hint.textContent = "Felt shaky \u2014 hold or drop next time.";
      else hint.textContent = "Tough but controlled \u2014 hold here one more session.";
      box.appendChild(hint);
    }
  }

  return box;
}

function renderCoreRow(c) {
  const wrap = document.createElement("div");
  wrap.className = "row";
  const existing = coreDraft.find(x => x.id === c.id);
  const top = document.createElement("div");
  top.className = "ex-top";
  const nameEl = document.createElement("div");
  nameEl.className = "ex-name";
  nameEl.textContent = c.name;
  top.appendChild(nameEl);

  if (!existing) {
    const addBtn = document.createElement("button");
    addBtn.className = "btn btn-sm";
    addBtn.textContent = "Add";
    addBtn.onclick = () => { coreDraft.push({ id: c.id, mode: c.mode, value: "" }); render(); };
    top.appendChild(addBtn);
  } else {
    const rmBtn = document.createElement("button");
    rmBtn.className = "icon-btn";
    rmBtn.innerHTML = "&times;";
    rmBtn.onclick = () => { coreDraft = coreDraft.filter(x => x.id !== c.id); render(); };
    top.appendChild(rmBtn);
  }
  wrap.appendChild(top);

  if (existing) {
    const inputRow = document.createElement("div");
    inputRow.style.marginTop = "8px";
    const input = document.createElement("input");
    input.type = "number";
    input.placeholder = c.mode === "time" ? "Seconds held" : "Reps completed";
    input.value = existing.value;
    input.oninput = (e) => { existing.value = e.target.value; };
    inputRow.appendChild(input);
    wrap.appendChild(inputRow);
  }
  return wrap;
}

function saveTodaySession() {
  const prog = PROGRAM[selectedDay];
  const sessionExercises = [];
  prog.exercises.forEach(ex => {
    const d = todayDraft[ex.id];
    if (!d) return;
    const loggedSets = d.sets.filter(Boolean);
    if (loggedSets.length === 0) return;
    if (ex.type === "squat") applySquatWeight(ex.track, d.weight);
    else state.weights[ex.id] = d.weight;
    sessionExercises.push({
      id: ex.id, name: ex.name,
      setsLogged: loggedSets.length, setsPlanned: ex.sets,
      weight: d.weight, feel: d.feel || null
    });
  });

  const sessionCore = coreDraft.filter(c => c.value !== "").map(c => {
    const meta = CORE_OPTIONS.find(x => x.id === c.id);
    return { id: c.id, name: meta.name, detail: c.value + (meta.mode === "time" ? "s" : " reps") };
  });

  if (sessionExercises.length === 0 && sessionCore.length === 0) {
    showToast("Log at least one set first");
    return;
  }

  state.sessions.unshift({ date: todayStr(), day: selectedDay, exercises: sessionExercises, core: sessionCore });
  saveState();
  todayDraft = {};
  coreDraft = [];
  showToast("Session saved");
  render();
}

// ---------- Progress tab ----------
function renderProgress(el) {
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = "Squat progression";
  card.appendChild(h2);

  if (state.weights.squat_a >= SQUAT_CAP) {
    const b = document.createElement("div");
    b.className = "banner cap";
    b.innerHTML = "<span>&#10003;</span><span>Heavy day capped at " + SQUAT_CAP + " lb. Hold and consolidate.</span>";
    card.appendChild(b);
  }

  const grid = document.createElement("div");
  grid.className = "stat-grid";
  grid.appendChild(statBlock("Heavy day (A)", state.weights.squat_a + " lb", "5x5"));
  grid.appendChild(statBlock("Light day (B)", state.weights.squat_b + " lb", "5x5"));
  card.appendChild(grid);

  const remaining = SQUAT_CAP - state.weights.squat_a;
  const increment = state.squatPhase === "ramp10" ? 10 : 5;
  const phaseNote = document.createElement("p");
  phaseNote.style.cssText = "font-size:12px;color:var(--text-muted);margin-top:0.7rem;";
  phaseNote.textContent = state.weights.squat_a >= SQUAT_CAP
    ? "Ceiling reached."
    : "Ramping +" + increment + " lb/week \u00b7 " + remaining + " lb to go on heavy day.";
  card.appendChild(phaseNote);
  el.appendChild(card);

  const histCard = document.createElement("div");
  histCard.className = "card";
  const hh = document.createElement("h2");
  hh.textContent = "Squat history";
  histCard.appendChild(hh);

  const squatSessions = state.sessions.filter(s => s.exercises.some(e => e.id === "squat_a" || e.id === "squat_b")).slice(0, 12);
  if (squatSessions.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No squat sessions logged yet.";
    histCard.appendChild(empty);
  } else {
    const maxW = Math.max(...squatSessions.flatMap(s => s.exercises.filter(e=>e.id.startsWith("squat")).map(e=>e.weight)), SQUAT_CAP);
    squatSessions.forEach(s => {
      const sq = s.exercises.find(e => e.id === "squat_a" || e.id === "squat_b");
      if (!sq) return;
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:9px;padding:6px 0;";
      const label = document.createElement("div");
      label.style.cssText = "font-size:11px;color:var(--text-muted);width:52px;flex:0 0 auto;";
      label.textContent = fmtDate(s.date);
      row.appendChild(label);
      const barWrap = document.createElement("div");
      barWrap.style.cssText = "flex:1;background:var(--card-sunken);border-radius:6px;height:18px;position:relative;overflow:hidden;";
      const bar = document.createElement("div");
      const pct = Math.min(100, (sq.weight / maxW) * 100);
      bar.style.cssText = "height:100%;background:" + (sq.id === "squat_a" ? "var(--accent)" : "var(--border-strong)") + ";width:" + pct + "%;border-radius:6px;";
      barWrap.appendChild(bar);
      row.appendChild(barWrap);
      const wLabel = document.createElement("div");
      wLabel.style.cssText = "font-family:var(--font-display);font-size:12.5px;font-weight:600;width:50px;text-align:right;flex:0 0 auto;";
      wLabel.textContent = sq.weight + " lb";
      row.appendChild(wLabel);
      histCard.appendChild(row);
    });
  }
  el.appendChild(histCard);

  const allCard = document.createElement("div");
  allCard.className = "card";
  const ah = document.createElement("h2");
  ah.textContent = "All current weights";
  allCard.appendChild(ah);
  ["A","B"].forEach(d => {
    PROGRAM[d].exercises.forEach(ex => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:0.5px solid var(--border);";
      const l = document.createElement("div");
      l.className = "w-label";
      l.textContent = ex.name + " (" + PROGRAM[d].label + ")";
      row.appendChild(l);
      const w = document.createElement("div");
      w.className = "weight-badge";
      w.textContent = state.weights[ex.id] + " lb";
      row.appendChild(w);
      allCard.appendChild(row);
    });
  });
  if (allCard.children.length > 1) allCard.children[1].style.borderTop = "none";
  el.appendChild(allCard);
}

function statBlock(label, val, sub) {
  const d = document.createElement("div");
  d.className = "stat";
  const l = document.createElement("div");
  l.className = "stat-label";
  l.textContent = label;
  const v = document.createElement("div");
  v.className = "stat-val";
  v.textContent = val;
  d.appendChild(l);
  d.appendChild(v);
  if (sub) {
    const s = document.createElement("div");
    s.style.cssText = "font-size:11px;color:var(--text-muted);margin-top:3px;";
    s.textContent = sub;
    d.appendChild(s);
  }
  return d;
}

// ---------- Running tab (C25K) ----------
function renderCardio(el) {
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = "C25K";
  card.appendChild(h2);
  const doneCount = Object.values(state.c25k).filter(Boolean).length;
  const sub = document.createElement("p");
  sub.style.cssText = "font-size:12px;color:var(--text-muted);margin:-6px 0 8px;";
  sub.textContent = doneCount + " of 27 runs completed";
  card.appendChild(sub);

  for (let w = 1; w <= 9; w++) {
    const weekLabel = document.createElement("div");
    weekLabel.style.cssText = "font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-secondary);margin:12px 0 2px;";
    weekLabel.textContent = "Week " + w;
    card.appendChild(weekLabel);
    for (let d = 1; d <= 3; d++) {
      const key = "W" + w + "D" + d;
      const item = document.createElement("div");
      item.className = "checklist-item";
      const check = document.createElement("div");
      check.className = "check" + (state.c25k[key] ? " done" : "");
      check.innerHTML = state.c25k[key] ? "&#10003;" : "";
      check.onclick = () => { state.c25k[key] = !state.c25k[key]; saveState(); render(); };
      item.appendChild(check);
      const label = document.createElement("div");
      label.className = "w-label";
      label.textContent = key;
      item.appendChild(label);
      card.appendChild(item);
    }
  }
  el.appendChild(card);
}

// ---------- Hydration tab ----------
function renderHydration(el) {
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = "Today's water";
  card.appendChild(h2);
  const sub = document.createElement("p");
  sub.style.cssText = "font-size:12.5px;color:var(--text-secondary);margin:-4px 0 4px;";
  sub.textContent = "4 bottles (32oz each) \u2248 4L target";
  card.appendChild(sub);

  const bottleRow = document.createElement("div");
  bottleRow.className = "bottle-row";
  for (let i = 0; i < 4; i++) {
    const b = document.createElement("div");
    b.className = "bottle" + (i < state.hydrationToday.bottles ? " filled" : "");
    b.textContent = i < state.hydrationToday.bottles ? "\u2713" : String(i + 1);
    b.onclick = () => {
      state.hydrationToday.bottles = i < state.hydrationToday.bottles ? i : i + 1;
      saveState();
      render();
    };
    bottleRow.appendChild(b);
  }
  card.appendChild(bottleRow);

  const status = document.createElement("p");
  status.style.cssText = "font-size:12.5px;color:var(--text-muted);text-align:center;margin:8px 0 0;";
  const left = 4 - state.hydrationToday.bottles;
  status.textContent = left <= 0 ? "Target hit for today." : left + " bottle" + (left === 1 ? "" : "s") + " to go.";
  card.appendChild(status);
  el.appendChild(card);

  const noteCard = document.createElement("div");
  noteCard.className = "card";
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.style.padding = "0.4rem 0";
  empty.textContent = "Resets clean each day \u2014 no catch-up math on a missed day.";
  noteCard.appendChild(empty);
  el.appendChild(noteCard);
}

// ---------- Supplements tab ----------
function renderSupplements(el) {
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = "Today's supplements";
  card.appendChild(h2);

  const totalDoses = SUPPLEMENTS.reduce((sum, s) => sum + s.doses, 0);
  const takenDoses = SUPPLEMENTS.reduce((sum, s) => sum + (state.supplementsToday.taken[s.id] || 0), 0);
  const sub = document.createElement("p");
  sub.style.cssText = "font-size:12px;color:var(--text-muted);margin:-6px 0 6px;";
  sub.textContent = takenDoses + " of " + totalDoses + " doses taken today";
  card.appendChild(sub);

  SUPPLEMENTS.forEach(s => {
    const item = document.createElement("div");
    item.className = "row";

    const top = document.createElement("div");
    top.className = "ex-top";
    const textWrap = document.createElement("div");
    const label = document.createElement("div");
    label.className = "ex-name";
    label.textContent = s.name;
    textWrap.appendChild(label);
    const note = document.createElement("div");
    note.className = "ex-meta";
    note.textContent = s.note;
    textWrap.appendChild(note);
    top.appendChild(textWrap);

    const taken = state.supplementsToday.taken[s.id] || 0;

    if (s.doses === 1) {
      const check = document.createElement("div");
      check.className = "check" + (taken >= 1 ? " done" : "");
      check.innerHTML = taken >= 1 ? "&#10003;" : "";
      check.style.flex = "0 0 auto";
      check.onclick = () => {
        state.supplementsToday.taken[s.id] = taken >= 1 ? 0 : 1;
        saveState();
        render();
      };
      top.appendChild(check);
      item.appendChild(top);
    } else {
      item.appendChild(top);
      const chips = document.createElement("div");
      chips.className = "set-chips";
      for (let i = 0; i < s.doses; i++) {
        const chip = document.createElement("div");
        const filled = i < taken;
        chip.className = "set-chip" + (filled ? " filled" : "");
        chip.textContent = filled ? "\u2713" : String(i + 1);
        chip.onclick = () => {
          state.supplementsToday.taken[s.id] = i < taken ? i : i + 1;
          saveState();
          render();
        };
        chips.appendChild(chip);
      }
      item.appendChild(chips);
      const doseNote = document.createElement("div");
      doseNote.className = "reps-note";
      doseNote.textContent = taken + " of " + s.doses + " doses today \u00b7 tap to mark taken";
      item.appendChild(doseNote);
    }
    card.appendChild(item);
  });
  el.appendChild(card);

  const noteCard = document.createElement("div");
  noteCard.className = "card";
  const noteH = document.createElement("div");
  noteH.className = "empty";
  noteH.style.padding = "0.4rem 0";
  noteH.textContent = "Resets daily, same as hydration \u2014 tracking isn't a recommendation, just a log.";
  noteCard.appendChild(noteH);
  el.appendChild(noteCard);
}

// ---------- Log tab ----------
function renderLog(el) {
  const card = document.createElement("div");
  card.className = "card";
  const h2 = document.createElement("h2");
  h2.textContent = "Session history";
  card.appendChild(h2);

  if (state.sessions.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No sessions logged yet. Head to Today to log your first one.";
    card.appendChild(empty);
  } else {
    state.sessions.slice(0, 20).forEach((s, idx) => {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const dateLine = document.createElement("div");
      dateLine.className = "flex-between";
      const dateText = document.createElement("span");
      dateText.innerHTML = '<span class="log-date">' + fmtDate(s.date) + '</span> &middot; ' + PROGRAM[s.day].label;
      dateLine.appendChild(dateText);
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn";
      delBtn.innerHTML = "&times;";
      delBtn.setAttribute("aria-label", "Delete session");
      delBtn.onclick = () => {
        lastDeletedSession = { session: s, index: idx };
        state.sessions.splice(idx, 1);
        saveState();
        render();
        showToast("Session removed", () => {
          if (lastDeletedSession) {
            state.sessions.splice(lastDeletedSession.index, 0, lastDeletedSession.session);
            saveState();
            render();
          }
        });
      };
      dateLine.appendChild(delBtn);
      entry.appendChild(dateLine);

      const detail = document.createElement("div");
      detail.style.marginTop = "4px";
      const parts = s.exercises.map(e => {
        const setsInfo = e.setsLogged !== undefined ? e.setsLogged + "/" + e.setsPlanned + " sets" : "";
        return e.name + " " + e.weight + "lb" + (setsInfo ? " (" + setsInfo + ")" : "") + (e.feel ? " \u00b7 " + e.feel : "");
      });
      if (s.core && s.core.length) s.core.forEach(c => parts.push(c.name + " " + c.detail));
      detail.textContent = parts.join(" \u00b7 ");
      entry.appendChild(detail);
      card.appendChild(entry);
    });
  }
  el.appendChild(card);
}

// ---------- init ----------
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  currentTab = btn.dataset.tab;
  render();
});

document.getElementById("modeToggle").addEventListener("click", () => {
  state.mode = state.mode === "dark" ? "light" : "dark";
  applyMode();
  saveState();
});

function initInstallBanner() {
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if (!isStandalone && !state.installDismissed) {
    document.getElementById("installBanner").style.display = "flex";
  }
  document.getElementById("dismissInstall").onclick = () => {
    document.getElementById("installBanner").style.display = "none";
    state.installDismissed = true;
    saveState();
  };
}

(async function init() {
  await loadState();
  applyMode();
  initInstallBanner();
  render();
})();
</script>
</body>
</html>
